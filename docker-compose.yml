version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: audit-backend
    restart: always
    volumes:
      - ./backend/db:/app/db
      - ./backend/.env:/app/.env
      # ключ моста генерации картинок (agy), только чтение
      - ./backend/secrets:/app/secrets:ro
    # No need to expose port to host, nginx will proxy to it internally
    networks:
      - audit-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: audit-frontend
    restart: always
    ports:
      # Только docker-мост: снаружи доступ идет через Caddy (audit.ktgas.kz, basic auth).
      # Прямой http://IP:3000 из интернета закрыт.
      - "172.17.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - audit-net

networks:
  audit-net:
    driver: bridge
